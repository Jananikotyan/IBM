services:
  # ── Backend (FastAPI) — runs on Render free tier ──────────────────────────
  - type: web
    name: sehat-saathi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOCK_MODE
        value: "false"
      - key: OLLAMA_MODE
        value: "false"
      - key: APP_ENV
        value: production
      - key: VECTOR_DB_PATH
        value: ./data/vector_store
      - key: DOCS_PATH
        value: ./data/knowledge_base
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set manually in Render dashboard
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        value: sehat_saathi_verify
